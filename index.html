<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Batalla Kawaii 💗</title>
<style>
:root{
  --pink1:#fff0f7; --pink2:#ffd3e8; --pink3:#ff9dca;
  --pink4:#e754a1; --ink:#6e2e52; --card:rgba(255,255,255,.78);
}
*{box-sizing:border-box}
html,body{
  margin:0;min-height:100%;
  font-family:ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;
  color:var(--ink);
}
body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:24px;overflow:hidden;
  background:
    radial-gradient(circle at 15% 15%, rgba(255,255,255,.95), transparent 26%),
    radial-gradient(circle at 85% 20%, rgba(255,190,224,.75), transparent 28%),
    linear-gradient(160deg,var(--pink1),var(--pink2) 52%,#f2c7ff);
}
.sparkles{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.sparkles span{
  position:absolute;opacity:.45;animation:float 6s ease-in-out infinite alternate;
  font-size:clamp(18px,3vw,34px);
}
@keyframes float{to{transform:translateY(-28px) rotate(14deg)}}
.app{width:min(900px,95vw);position:relative;z-index:2}
.top{text-align:center;margin-bottom:18px}
h1{
  margin:0;font-size:clamp(2.1rem,7vw,4.6rem);color:#ca468e;
  letter-spacing:-.045em;
}
.subtitle{margin:8px 0 0;font-size:clamp(1rem,2.6vw,1.18rem);opacity:.86}
.battle{
  display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:stretch;
}
.card{
  background:var(--card);border:1px solid rgba(255,255,255,.85);
  border-radius:30px;padding:28px 20px;text-align:center;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 18px 50px rgba(137,55,98,.14);
  min-height:255px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:.35s transform,.35s box-shadow;
}
.card.winner{
  transform:translateY(-7px) scale(1.025);
  box-shadow:0 22px 65px rgba(219,76,151,.25);
}
.name{font-weight:900;font-size:clamp(1.5rem,4vw,2.4rem);margin-bottom:14px}
.score{
  font-size:clamp(3.2rem,10vw,6rem);font-weight:950;line-height:1;
  color:#d84b97;letter-spacing:-.06em;
}
.label{margin-top:10px;font-weight:800;opacity:.75;font-size:1.05rem}
.vs{
  display:flex;align-items:center;justify-content:center;font-weight:950;
  font-size:clamp(1.3rem,4vw,2.1rem);color:#c24b8e;padding:0 2px;
}
.controls{
  margin-top:20px;display:flex;flex-direction:column;align-items:center;gap:12px;
}
button{
  border:0;border-radius:999px;padding:15px 24px;
  background:linear-gradient(135deg,#ff7eb8,#df57a1);color:#fff;
  font:800 17px/1 system-ui,sans-serif;cursor:pointer;
  box-shadow:0 12px 28px rgba(214,72,145,.28);
  transition:.18s transform,.18s filter;
}
button:hover{filter:brightness(1.04)}
button:active{transform:scale(.97)}
.result{
  min-height:28px;text-align:center;font-weight:900;
  font-size:clamp(1rem,2.8vw,1.2rem);color:#b83e82;
}
.pop{animation:pop .45s ease}
@keyframes pop{
  0%{transform:scale(.75);opacity:.25}
  70%{transform:scale(1.12)}
  100%{transform:scale(1);opacity:1}
}
@media(max-width:680px){
  body{padding:16px}
  .battle{grid-template-columns:1fr;gap:12px}
  .vs{padding:2px 0}
  .card{min-height:200px}
}
</style>
</head>
<body>

<div class="sparkles" aria-hidden="true">
  <span style="left:6%;top:10%;animation-delay:.2s">💗</span>
  <span style="left:17%;top:72%;animation-delay:1.4s">✨</span>
  <span style="left:84%;top:14%;animation-delay:.8s">💕</span>
  <span style="left:91%;top:70%;animation-delay:1.9s">⭐</span>
  <span style="left:50%;top:5%;animation-delay:.5s">🌸</span>
  <span style="left:42%;top:83%;animation-delay:1.1s">💖</span>
</div>

<main class="app">
  <div class="top">
    <h1>% de Kawaii 🎀</h1>
      </div>

  <section class="battle">
    <div class="card" id="gaelCard">
      <div class="name">GaelitoUwU</div>
      <div class="score" id="gaelScore">--%</div>
      <div class="label">de kawaii</div>
    </div>

    <div class="vs">VS</div>

    <div class="card" id="valeriaCard">
      <div class="name">valepro777</div>
      <div class="score" id="valeriaScore">--%</div>
      <div class="label">de kawaii</div>
    </div>
  </section>

  <div class="controls">
    <button id="rollBtn">Calcular kawaii 💞</button>
    <div class="result" id="result"></div>
  </div>
</main>

<script>
const gaelScore = document.getElementById('gaelScore');
const valeriaScore = document.getElementById('valeriaScore');
const gaelCard = document.getElementById('gaelCard');
const valeriaCard = document.getElementById('valeriaCard');
const result = document.getElementById('result');
const rollBtn = document.getElementById('rollBtn');

function randomTenth(min,max){
  const minInt=Math.ceil(min*10);
  const maxInt=Math.floor(max*10);
  return (Math.floor(Math.random()*(maxInt-minInt+1))+minInt)/10;
}

function animateScore(el,value){
  el.classList.remove('pop');
  void el.offsetWidth;
  el.textContent=value.toFixed(1)+'%';
  el.classList.add('pop');
}

function rollKawaii(){
  // 20% de probabilidad de que valepro777 rompa la escala.
  const valeBreaksScale = Math.random() < 0.20;

  if (valeBreaksScale) {
    const gael = randomTenth(1,100);

    gaelScore.textContent = gael.toFixed(1) + '%';
    valeriaScore.textContent = '∞%';

    valeriaScore.classList.remove('pop');
    gaelScore.classList.remove('pop');
    void valeriaScore.offsetWidth;
    void gaelScore.offsetWidth;
    valeriaScore.classList.add('pop');
    gaelScore.classList.add('pop');

    valeriaCard.classList.add('winner');
    gaelCard.classList.remove('winner');

    result.textContent = 'valepro777 rompio la escala ♾️🎀';
    rollBtn.textContent = 'Otra vez 🎀';
    return;
  }

  // El otro 80% del tiempo, GaelitoUwU siempre gana por al menos 0.1%.
  const valeria = randomTenth(1,99.9);
  const gaelMin = Math.min(100,valeria+0.1);
  const gael = randomTenth(gaelMin,100);

  animateScore(valeriaScore,valeria);
  animateScore(gaelScore,gael);

  gaelCard.classList.add('winner');
  valeriaCard.classList.remove('winner');

  const difference=(gael-valeria).toFixed(1);
  result.textContent=`GaelitoUwU gana por ${difference}% 💗`;
  rollBtn.textContent='Otra vez 🎀';
}

rollBtn.addEventListener('click',rollKawaii);
</script>

</body>
</html>
